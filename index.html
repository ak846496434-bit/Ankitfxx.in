<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANKITFXX - Redirecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #050505;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .loader-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ANKITFXX Text */
        .loading-text {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 10px;
            text-transform: uppercase;
            z-index: 10;
        }

        .loading-text span {
            display: inline-block;
            animation: glow-wave 1.5s ease-in-out infinite;
        }

        /* Letter Delays */
        .loading-text span:nth-child(1) { animation-delay: 0.1s; }
        .loading-text span:nth-child(2) { animation-delay: 0.2s; }
        .loading-text span:nth-child(3) { animation-delay: 0.3s; }
        .loading-text span:nth-child(4) { animation-delay: 0.4s; }
        .loading-text span:nth-child(5) { animation-delay: 0.5s; }
        .loading-text span:nth-child(6) { animation-delay: 0.6s; }
        .loading-text span:nth-child(7) { animation-delay: 0.7s; }
        .loading-text span:nth-child(8) { animation-delay: 0.8s; }

        @keyframes glow-wave {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 10px #00d4ff; }
            50% { transform: translateY(-15px); color: #00d4ff; text-shadow: 0 0 30px #00d4ff; }
        }

        /* Outer Rotating Ring */
        .ring {
            position: absolute;
            width: 420px;
            height: 420px;
            border: 2px solid transparent;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Loading Bar */
        .loading-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #00d4ff);
            box-shadow: 0 0 15px #00d4ff;
            border-radius: 10px;
            /* Yahan hum animation ko 3s rakhenge redirection ke liye */
            animation: fill-bar 3s forwards linear;
        }

        .loading-status {
            color: #00d4ff;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        @keyframes fill-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader-wrapper">
            <div class="loading-text">
                <span>A</span><span>N</span><span>K</span><span>I</span><span>T</span><span>F</span><span>X</span><span>X</span>
            </div>
            <div class="ring"></div>
        </div>

        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
        <div id="status" class="loading-status">Initializing...</div>
    </div>

    <script>
        // 3 Seconds (3000ms) ke baad website par bhej dega
        setTimeout(function() {
            document.getElementById('status').innerText = "Access Granted!";
            window.location.href = "https://skull-info.in/";
        }, 3000);
    </script>

</body>
  </html>
